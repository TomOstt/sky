name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
  # fmt and clippy gates come next, once the toolchain is pinned.
  # cargo-deny and cargo-fuzz jobs: reserved for Security Officer's setup.
