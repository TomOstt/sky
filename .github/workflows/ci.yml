name: CI
on:
  push:
    branches: [main]
    # Docs- and spec-only changes cost CI minutes without testing anything.
    # A change that also touches code or tests still runs everything.
    paths-ignore: ['spec/**', '**/*.md']
  pull_request:
    paths-ignore: ['spec/**', '**/*.md']
# A newer push to the same PR cancels its older run: each merge of main into
# a branch otherwise bills a full run that nobody reads. Pushes to main are
# grouped by commit, so every main commit keeps its own complete run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  # Third-party actions below are pinned to full commit SHAs so a moved tag
  # can't change what runs in CI. The comment on each line is the tag it was.
  # macOS too: sky-project's Unix-only paths (openat, fstatat, ownership
  # checks) behave differently there, and it is a primary developer platform.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.85.1 # keep in sync with rust-toolchain.toml
      # --locked: fail instead of silently updating Cargo.lock.
      - run: cargo test --workspace --locked

  # The escaped-character table in sky-diag is generated from pinned Unicode
  # data (SHA-256 checked); fail if the committed table or its verbatim-record
  # fixture no longer match what the generator produces. Needs only python3,
  # which the runner image has.
  unicode-table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: python3 crates/sky-diag/tools/gen_display_unsafe.py --check

  # Test-only names (hooks, constructors) must never reach release builds.
  # The script builds every workspace crate in release mode and scans the
  # rlibs, their metadata, and the sky binary with strings and nm (binutils
  # ships with the runner image) for every name in
  # tools/release-symbol-denylist.txt.
  release-symbols:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.85.1 # keep in sync with rust-toolchain.toml
      - run: tools/check_release_symbols.sh

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.85.1 # keep in sync with rust-toolchain.toml
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      # The fuzz crate is its own workspace, so the root commands skip it.
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.85.1 # keep in sync with rust-toolchain.toml
          components: rustfmt, clippy
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      # Stable 1.85.1 is enough to lint the fuzz crate; only `cargo fuzz` needs nightly.
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --locked --all-targets -- -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: fuzz/Cargo.toml
          command: check advisories bans licenses sources

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-fuzz@0.13.2
      # Short smoke runs on every PR: 60 seconds per target from its seed
      # corpus (fuzz/corpus/<target>), with cargo-fuzz's default ASan.
      # --target is explicit because the prebuilt cargo-fuzz is a musl binary
      # and would otherwise default to the musl target, which ASan rejects.
      - run: cargo +nightly fuzz run lex --target x86_64-unknown-linux-gnu -- -max_total_time=60
      - run: cargo +nightly fuzz run parse_module --target x86_64-unknown-linux-gnu -- -max_total_time=60
      - run: cargo +nightly fuzz run sir_parse --target x86_64-unknown-linux-gnu -- -max_total_time=60
      - run: cargo +nightly fuzz run manifest --target x86_64-unknown-linux-gnu -- -max_total_time=60
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crash
          path: fuzz/artifacts/
