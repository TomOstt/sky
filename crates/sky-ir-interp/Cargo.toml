[package]
name = "sky-ir-interp"
description = "Reference interpreter for SIR, Sky's semantic intermediate representation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sky-diag = { path = "../sky-diag" }
sky-interp = { path = "../sky-interp" }
sky-jit = { path = "../sky-jit" }
sky-ir = { path = "../sky-ir" }
sky-units = { path = "../sky-units" }
rayon = "1"

[dev-dependencies]
sky-derive = { path = "../sky-derive" }
sky-jit = { path = "../sky-jit" }
sky-opt = { path = "../sky-opt" }
proptest = { version = "1", default-features = false, features = ["std"] }
sky-ast = { path = "../sky-ast" }
sky-lower = { path = "../sky-lower" }
sky-syntax = { path = "../sky-syntax" }
sky-types = { path = "../sky-types" }

[[bench]]
name = "fused_threshold"
harness = false
