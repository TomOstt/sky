[package]
name = "sky-jit"
description = "Native code for SIR through Cranelift (Phase 4)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
sky-diag = { path = "../sky-diag" }
sky-ir = { path = "../sky-ir" }
sky-interp = { path = "../sky-interp" }
sky-types = { path = "../sky-types" }
sky-units = { path = "../sky-units" }
# `x86` and `arm64` are code generators for targets other than the host:
# `sky build --target=...` writes objects for either from any machine.
cranelift-codegen = { version = "0.121.2", features = ["x86", "arm64"] }
cranelift-frontend = "0.121.2"
cranelift-jit = "0.121.2"
cranelift-module = "0.121.2"
cranelift-native = "0.121.2"
cranelift-object = "0.121.2"
target-lexicon = "0.13.5"

[[bench]]
name = "kernels"
harness = false
