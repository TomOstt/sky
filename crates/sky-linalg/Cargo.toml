[package]
name = "sky-linalg"
description = "Fast, reproducible dense linear algebra kernels for Sky"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rayon = "1.12.0"

[dev-dependencies]
# Property tests only.
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
# The baselines `benches/blas.rs` compares against. They fuse multiply-add,
# so their rounding differs from Sky's and they can never serve the
# reproducible path.
faer = { version = "0.24.4", default-features = false, features = ["std", "rayon", "linalg"] }
matrixmultiply = { version = "0.3.11", features = ["threading"] }

[[bench]]
name = "blas"
harness = false
