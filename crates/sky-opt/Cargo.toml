[package]
name = "sky-opt"
description = "Optimization passes over SIR and the default pipeline: constant folding, e-graph rewriting, dead-code elimination, elementwise kernel fusion, Cholesky solve selection, specialization on shapes and values"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sky-diag = { path = "../sky-diag" }
sky-egraph = { path = "../sky-egraph" }
sky-interp = { path = "../sky-interp" }
sky-ir = { path = "../sky-ir" }
sky-types = { path = "../sky-types" }
sky-units = { path = "../sky-units" }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
sky-ad = { path = "../sky-ad" }
sky-ast = { path = "../sky-ast" }
sky-ir-interp = { path = "../sky-ir-interp" }
sky-lower = { path = "../sky-lower" }
sky-syntax = { path = "../sky-syntax" }
