[package]
name = "sky-project"
description = "Project-root discovery and import resolution for Sky"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sky-diag = { path = "../sky-diag" }

[target.'cfg(unix)'.dependencies]
# geteuid() and getpwuid_r(): std has no API for the effective uid or the
# passwd home directory. FFI declarations only (libc's build.rs does cfg
# detection; no proc macros).
libc = { version = "0.2", default-features = false }
