[package]
name = "sky-types"
description = "Type checker for Sky: units, shapes, matrix properties"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sky-ast = { path = "../sky-ast" }
sky-diag = { path = "../sky-diag" }
sky-units = { path = "../sky-units" }

[dev-dependencies]
# Property tests only; not linked into any shipped artifact.
proptest = { version = "1", default-features = false, features = ["std"] }
# The UI goldens and the depth test lex real source.
sky-syntax = { path = "../sky-syntax" }
