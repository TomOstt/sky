[package]
name = "r9tok"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"

[dependencies]
tokenizers = { version = "=0.23.2", default-features = false, features = ["unstable_wasm"] }
minijinja = { version = "=2.24.0", default-features = true, features = ["json", "loop_controls"] }
minijinja-contrib = { version = "=2.24.0", features = ["pycompat"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde = "1"

[features]
preserve_order = ["minijinja/preserve_order"]
