[package]
name = "sky-fuzz"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sky-ast = { path = "../crates/sky-ast" }
sky-syntax = { path = "../crates/sky-syntax" }
sky-diag = { path = "../crates/sky-diag" }
sky-ir = { path = "../crates/sky-ir" }
sky-project = { path = "../crates/sky-project" }
# The differential target runs both engines: `sky run`'s AST interpreter,
# and lowering plus the SIR reference interpreter.
sky-interp = { path = "../crates/sky-interp" }
sky-ir-interp = { path = "../crates/sky-ir-interp" }
sky-lower = { path = "../crates/sky-lower" }
sky-types = { path = "../crates/sky-types" }

# Keep the fuzz crate out of the main workspace so stable `cargo test --workspace` never builds it.
[workspace]
members = ["."]

[[bin]]
name = "lex"
path = "fuzz_targets/lex.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_module"
path = "fuzz_targets/parse_module.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sir_parse"
path = "fuzz_targets/sir_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "differential"
path = "fuzz_targets/differential.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
